name: example
description: "swrly example app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  # State management libraries — used ONLY by the per-pattern demos in
  # lib/patterns/. The `swrly` package itself does not depend on any of
  # these; see doc/CONVENTIONS.md.
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.6
  flutter_hooks: ^0.20.5
  swrly:
    path: ../
  swrly_hooks:
    path: ../packages/swrly_hooks

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
