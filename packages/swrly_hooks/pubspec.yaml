name: swrly_hooks
description: >-
  Flutter Hooks bindings for swrly — `useSwrlyQuery` and `useSwrlyMutation`
  for consuming a swrly cache from HookWidget-based screens.
version: 0.3.0-dev.2
homepage: https://github.com/redhotsixbull/swrly
repository: https://github.com/redhotsixbull/swrly
issue_tracker: https://github.com/redhotsixbull/swrly/issues

topics:
  - swrly
  - flutter-hooks
  - state-management
  - cache

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Widened to accept both 0.20.x and 0.21.x — the APIs we use (useEffect,
  # useState, useRef, useStream) have been stable across both. Pinning to
  # ^0.20.5 broke `flutter pub add swrly_hooks` for anyone on the current
  # flutter_hooks release (0.21).
  flutter_hooks: '>=0.20.5 <0.22.0'
  swrly: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
